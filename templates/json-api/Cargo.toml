[package]
name = "crawlee-json-api"
description = "HttpCrawler on a JSON API (Hacker News): typed serde extraction and labeled requests."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1"
# Points at this checkout. `cargo generate` swaps in Cargo.generated.toml, which uses the git dependency.
crawlee = { path = "../../crates/crawlee" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
