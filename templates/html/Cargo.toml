[package]
name = "crawlee-html"
description = "HtmlCrawler with a router: list pages enqueue detail pages, detail pages are scraped."
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1"
# Points at this checkout. `cargo generate` swaps in Cargo.generated.toml, which uses the git dependency.
crawlee = { path = "../../crates/crawlee" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
