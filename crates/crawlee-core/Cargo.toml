[package]
name = "crawlee-core"
description = "Core types of crawlee-rs: Request, storages (Dataset, KeyValueStore, RequestQueue) and storage backends."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["fs-storage"]
# The file-system storage backend (the default storage of crawlers).
fs-storage = ["dep:crawlee-storage"]

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
crawlee-storage = { workspace = true, optional = true }
crawlee-utils.workspace = true
indexmap.workspace = true
parking_lot.workspace = true
rand.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
anyhow.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }

[lints]
workspace = true
