[package]
name = "crawlee-http-client"
description = "Pluggable HTTP client for crawlee-rs: redirect handling, session cookie jars and a reqwest-based transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["reqwest"]
reqwest = ["dep:reqwest", "dep:rustls", "dep:rustls-platform-verifier"]

[dependencies]
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
cookie_store.workspace = true
http.workspace = true
parking_lot.workspace = true
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
axum.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }

[lints]
workspace = true
